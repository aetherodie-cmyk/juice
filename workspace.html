<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Juice Workspace · 探索介面 V1</title><link rel="stylesheet" href="assets/workspace.css?v=explore-1"></head>
<body>
<header><a href="index.html" id="backToBoard">← Juice 白板</a><h1>Workspace <small>探索介面 V1</small></h1><button id="globalOverview" hidden>OMG 功能全覽</button><span id="saveState" role="status">尚未載入資料</span></header>
<main>
  <section class="intro"><div><h2>從功能版圖，走進每一項工作</h2><p>獨立檔案原型 · 修改後下載 JSON 保存 · 不讀寫正式白板或 Google Drive</p></div>
    <div class="actions"><button id="loadDemo">載入 Amendment 範例</button><button id="importButton">匯入 Workspace JSON</button><button id="exportButton" disabled>下載 Workspace JSON</button><input id="workspaceFile" type="file" accept=".json,application/json" hidden></div>
  </section>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="workspace" hidden>
    <div class="workspace-heading"><h2 id="workspaceTitle"></h2><span id="workspaceRevision"></span></div>
    <div id="exploreHeader"></div>
    <div class="workspace-layout" id="workspaceLayout">
      <section id="viewContent" aria-live="polite" aria-label="目前視角"></section>
      <aside id="objectPanel" aria-label="物件詳情"><h2>點選物件查看來源</h2><p>只維護一份任務資料，所有視角即時讀取相同 ID。</p></aside>
    </div>
    <details><summary>變更紀錄與資料保存</summary><div id="changeLog"></div><p>下載成功僅表示檔案已交給瀏覽器，請確認檔案已保存。此頁重新整理後不會自動恢復；未匯出的變更會提示離開確認。</p></details>
  </section>
</main>
<script src="assets/workspace-core.js?v=explore-1"></script><script src="assets/workspace-app.js?v=explore-1"></script>
</body></html>
